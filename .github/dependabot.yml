version: 2
updates:
  # Node.js / NestJS dependencies (apps/api, libs/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the Go-native port — it ships only the `tsc`
      # executable and dropped the programmatic compiler API until 7.1.
      # Nest CLI, ts-jest, and typescript-eslint all need that API, so the
      # known-good 5.x line must stay until every tool supports the new
      # major. Unblock manually when Nest CLI supports it.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      typescript-tooling:
        patterns:
          - "typescript"
          - "ts-jest"
          - "ts-node"
          - "typescript-eslint"
          - "eslint*"

  # Go crypto sidecar (cmd/crypto) — go-ethereum, go-bip32/39 are
  # security-critical; keep them current.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10

  # Container base images (node, golang, alpine, hashicorp/vault, postgres)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
