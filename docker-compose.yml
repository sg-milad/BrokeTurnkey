services:
  vault:
    image: hashicorp/vault:1.17
    container_name: walletmvp-vault
    restart: unless-stopped
    # Port 8200 is intentionally NOT published to the host — Vault is only
    # reachable on walletmvp-network. For local UI / manual unseal, use
    # docker-compose.dev.yml (see file) or `docker exec`.
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./vault/config:/vault/config:ro
    cap_add:
      - IPC_LOCK
      - CAP_SETFCAP
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - walletmvp-network

  postgres:
    image: postgres:16
    container_name: walletmvp-postgres
    restart: unless-stopped
    # Port 5432 is intentionally NOT published to the host. The API container
    # reaches Postgres via the docker network; host-side tooling (psql,
    # drizzle-kit studio) should use docker-compose.dev.yml or a docker exec.
    # The password is required — set POSTGRES_PASSWORD in .env (gitignored).
    # Never use a well-known default for a wallet platform database.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-walletmvp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - walletmvp-network

  crypto:
    build:
      context: .
      dockerfile: Dockerfile.crypto
      target: production
    container_name: walletmvp-crypto
    restart: unless-stopped
    # No ports exposed to host — reachable only on walletmvp-network.
    # Requests are additionally authenticated with CRYPTO_AUTH_TOKEN.
    env_file:
      - .env
    depends_on:
      - vault
    networks:
      - walletmvp-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: walletmvp-api
    restart: unless-stopped
    # 3000 is the only port a client ever needs. In production, build with
    # `target: production` instead (no repo mount, no dev server).
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - crypto
    command: pnpm run start:dev api
    networks:
      - walletmvp-network

networks:
  walletmvp-network:
    driver: bridge

volumes:
  vault-data:
    name: walletmvp_vault-data
  vault-logs:
    name: walletmvp_vault-logs
  postgres-data:
    name: walletmvp_postgres-data
