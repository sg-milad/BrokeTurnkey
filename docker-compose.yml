services:
  vault:
    image: hashicorp/vault:1.17
    container_name: walletmvp-vault
    restart: unless-stopped
    ports:
      - "8200:8200"          # exposed for local UI and unseal ceremony only
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./vault/config:/vault/config:ro
    cap_add:
      - IPC_LOCK
      - CAP_SETFCAP
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - walletmvp-network

  postgres:
    image: postgres:16
    container_name: walletmvp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"          # exposed for local tooling (drizzle-kit, psql)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: walletmvp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - walletmvp-network

  crypto:
    build:
      context: .
      dockerfile: Dockerfile.crypto
      target: production
    container_name: walletmvp-crypto
    restart: unless-stopped
    # No ports exposed to host — reachable only on walletmvp-network
    env_file:
      - .env.crypto
    depends_on:
      - vault
    networks:
      - walletmvp-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: walletmvp-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - crypto
    command: pnpm run start:dev
    networks:
      - walletmvp-network

networks:
  walletmvp-network:
    driver: bridge

volumes:
  vault-data:
  vault-logs:
  postgres-data:
